<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jura Guide Report</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="report.css" rel="stylesheet">
</head>
<body>
<script>
  // Restore the remembered sidebar state before the sidebar paints, so it does not animate on load.
  try { if (localStorage.getItem('sidebar') === 'open') document.body.classList.add('sidebar-open'); } catch (e) {}
</script>

<aside class="sidebar" aria-label="Report pages">
  <div class="sidebar-top">
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Expand sidebar" aria-expanded="false" aria-controls="sidebar-nav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <img class="sidebar-logo" src="freespirit_logo_crop.jpg" alt="Free Spirit">
  </div>
  <div class="sidebar-asof">
    <span class="date-field">
      <span class="date-text" id="as-of-text"></span>
      <svg class="date-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <input type="date" id="as-of-date" aria-label="Data as of">
    </span>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav">
    <button class="nav-tab side-tab" data-page="p25" data-tip="2025" onclick="showPage('p25', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><text x="12" y="18.2" text-anchor="middle" font-size="8.5" font-weight="700" font-family="IBM Plex Sans, sans-serif" fill="currentColor" stroke="none">25</text></svg>
      <span class="nav-label">2025</span>
      <span class="nav-key">1</span>
    </button>
    <button class="nav-tab side-tab" data-page="p26" data-tip="2026" onclick="showPage('p26', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><text x="12" y="18.2" text-anchor="middle" font-size="8.5" font-weight="700" font-family="IBM Plex Sans, sans-serif" fill="currentColor" stroke="none">26</text></svg>
      <span class="nav-label">2026</span>
      <span class="nav-key">2</span>
    </button>
    <button class="nav-tab side-tab active" data-page="cmp" data-tip="Comparison" onclick="showPage('cmp', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span class="nav-label">Comparison</span>
      <span class="nav-key">3</span>
    </button>
    <button class="nav-tab side-tab" data-page="bookings" data-tip="Bookings" onclick="showPage('bookings', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 10h16"/></svg>
      <span class="nav-label">Bookings</span>
      <span class="nav-key">4</span>
    </button>
    <button class="nav-tab side-tab" data-page="guides" data-tip="Guides" onclick="showPage('guides', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span class="nav-label">Guides</span>
      <span class="nav-key">5</span>
    </button>
    <button class="nav-tab side-tab" data-page="financial" data-tip="Financial" onclick="showPage('financial', this)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M16 7.5C16 6 14.2 5 12 5S8 6 8 8c0 4 8 2 8 6 0 2-1.8 3-4 3s-4-1-4-2.5"/></svg>
      <span class="nav-label">Financial</span>
      <span class="nav-key">6</span>
    </button>
  </nav>
  <div class="sidebar-foot">
    <button class="theme-toggle-icon" id="theme-toggle" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="nav-label">Dark mode</span>
    </button>
  </div>
</aside>

<nav class="bottom-nav">
  <button class="nav-tab bottom-tab" data-page="p25" onclick="showPage('p25', this)">2025</button>
  <button class="nav-tab bottom-tab" data-page="p26" onclick="showPage('p26', this)">2026</button>
  <button class="nav-tab bottom-tab active" data-page="cmp" onclick="showPage('cmp', this)">Comparison</button>
  <button class="nav-tab bottom-tab" data-page="bookings" onclick="showPage('bookings', this)">Bookings</button>
  <button class="nav-tab bottom-tab" data-page="guides" onclick="showPage('guides', this)">Guides</button>
  <button class="nav-tab bottom-tab" data-page="financial" onclick="showPage('financial', this)">Financial</button>
</nav>

<section id="page-p25" class="page"></section>
<section id="page-p26" class="page"></section>
<section id="page-cmp" class="page active"></section>
<section id="page-bookings" class="page"></section>
<section id="page-guides" class="page"></section>
<section id="page-financial" class="page"></section>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data-2025.js"></script>
<script src="data-2026.js"></script>
<script src="data-channels-2025.js"></script>
<script src="data-channels-2026.js"></script>
<script src="data-guide-notes.js"></script>
<script src="last-update.js"></script>
<script src="dist/app.js"></script>
</body>
</html>
